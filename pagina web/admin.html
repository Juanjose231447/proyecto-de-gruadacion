<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Panel de Administración</h1>
</header>

<div class="content">

    <h2>Editar Información</h2>

    <p>
        Este panel es una demostración. Aquí el administrador puede modificar
        el contenido de la página principal.
    </p>

    <textarea rows="15" cols="80">
Aquí puedes escribir nueva información sobre la energía solar...
    </textarea>

    <br><br>

    <button onclick="guardarCambios()">
        Guardar Cambios
    </button>

    <button onclick="window.location.href='index.html'">
        Volver al Inicio
    </button>

</div>

<script>
function guardarCambios() {
    alert("Cambios guardados (demostración escolar).");
}
</script>

</body>
</html>
